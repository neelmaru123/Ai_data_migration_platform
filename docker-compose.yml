version: '3.8'

services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: migration_platform_web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: migration_platform_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres_password@postgres:5432/migration_platform
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY:-placeholder}
    volumes:
      - ./apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  agent:
    build:
      context: ./apps/agent
      dockerfile: Dockerfile
    container_name: migration_platform_agent
    environment:
      - API_URL=http://api:8000
      - BACKEND_URL=http://api:8000
      - USER_EMAIL=${USER_EMAIL:-admin@example.com}
      - USER_PASSWORD=${USER_PASSWORD:-Password123!}
      - AGENT_NAME=Local-Docker-Agent
      - SRC_ECOMMERCE_URL=postgresql://postgres:postgres_password@postgres_ecommerce:5432/ecommerce_db
      - SRC_CRM_URL=postgresql://postgres:postgres_password@postgres_crm:5432/crm_db
      - SRC_INVENTORY_URL=mysql+pymysql://root:mysql_password@mysql_source:3306/inventory_db
      - SRC_ANALYTICS_URL=mongodb://root:mongo_password@mongo_source:27017/analytics_db?authSource=admin
      - DEST_TARGET_URL=postgresql://postgres:postgres_password@postgres:5432/unified_target_db
    depends_on:
      - api
      - postgres
      - postgres_ecommerce
      - postgres_crm
      - mysql_source
      - mongo_source
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: migration_platform_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_password
      - POSTGRES_DB=migration_platform
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d migration_platform"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres_ecommerce:
    image: postgres:16-alpine
    container_name: migration_platform_postgres_ecommerce
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_password
      - POSTGRES_DB=ecommerce_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_ecommerce_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres_crm:
    image: postgres:16-alpine
    container_name: migration_platform_postgres_crm
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_password
      - POSTGRES_DB=crm_db
    ports:
      - "5436:5432"
    volumes:
      - postgres_crm_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crm_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mysql_source:
    image: mysql:8.0
    container_name: migration_platform_mysql
    environment:
      - MYSQL_ROOT_PASSWORD=mysql_password
      - MYSQL_DATABASE=inventory_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pmysql_password"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongo_source:
    image: mongo:7.0
    container_name: migration_platform_mongo
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=mongo_password
      - MONGO_INITDB_DATABASE=analytics_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")' || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: migration_platform_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  postgres_ecommerce_data:
  postgres_crm_data:
  mysql_data:
  mongo_data:
