[tool.poetry]
name = "data-migration-platform-api"
version = "0.1.0"
description = "AI-assisted Data Migration Platform Backend API and Data Processing Packages"
authors = ["Lead Architect <architect@migrationplatform.com>"]
readme = "README.md"
packages = [
    { include = "app" }
]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"
sqlalchemy = "^2.0.35"
asyncpg = "^0.30.0"
polars = "^1.8.0"
duckdb = "^1.1.0"
pyarrow = "^18.0.0"
openpyxl = "^3.1.5"
alembic = "^1.13.0"
redis = "^5.0.8"
rq = "^1.16.2"
google-generativeai = "^0.8.0"
langchain-core = "^0.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
aiosqlite = "^0.20.0"
httpx = "^0.27.2"
ruff = "^0.6.5"
mypy = "^1.11.2"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests"
]
